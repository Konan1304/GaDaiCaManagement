services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - sql-data:/var/opt/mssql
      - ./backups:/var/opt/mssql/backups
    restart: unless-stopped
  backend:
    build: ./backend
    depends_on: [sqlserver]
    environment:
      APP_ENV: production
      PORT: 5000
      DB_SERVER: sqlserver
      DB_PORT: 1433
      DB_DATABASE: GaDaiCaManagement
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_ENCRYPT: "false"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${PUBLIC_URL}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - business-files:/app/uploads
    restart: unless-stopped
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["80:80"]
    restart: unless-stopped
volumes:
  sql-data:
  business-files:
